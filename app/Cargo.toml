[package]
name = "orbdash"
version = "1.2.0"
edition = "2024"
description = "Desktop app that controls a round GC9A01 display on an Arduino: Claude usage, clock, PC stats and custom widgets"
license = "MIT"
readme = "../README.md"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.35.0", features = ["persistence"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sysinfo = "0.38.4"
